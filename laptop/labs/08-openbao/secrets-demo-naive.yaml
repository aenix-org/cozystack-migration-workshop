# Лаба 8 · ступень 1 из 3: пароль лежит в манифесте открытым текстом.
# Так сервис «Пропуск» выглядит сегодня — и именно этот файл нашёл аудит.
# Применять его мы будем ровно один раз, чтобы увидеть проблему своими глазами.
#
# Три ступени лабы, чтобы не потеряться:
#   secrets-demo-naive.yaml   <- вы здесь: пароль видит каждый, кто открыл файл
#   secrets-demo-secret.yaml     пароль вынесен в отдельный объект Secret
#   secrets-demo.yaml            пароля в манифесте нет вообще
#
# Где применяется: ваш кластер `lab` (export KUBECONFIG=~/lab.kubeconfig).
# Команда: kubectl apply -f secrets-demo-naive.yaml
#
# Пароль в этом файле учебный и выдуманный, настоящих здесь нет. Один объект —
# Deployment; apiVersion, kind и metadata.name дальше не комментируются.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # Одной копии достаточно: мы смотрим не на отказоустойчивость, а на то,
  # откуда приложение берёт пароль.
  replicas: 1
  # По этой метке Deployment узнаёт свои поды. Совпадает с меткой в template ниже.
  selector:
    matchLabels:
      app: secrets-demo
  # template — шаблон пода: из чего собирать копию.
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # Требования безопасности: не от root, ограниченный набор системных вызовов.
      # Обратите внимание на разрыв: под настроен по всем правилам ИБ, и это никак
      # не мешает паролю лежать в файле десятью строками ниже.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Настоящего приложения здесь нет — busybox и несколько строк на shell.
          # Для этой лабы важно только одно: откуда берётся пароль, а не что с ним
          # делают дальше.
          image: busybox:1.36
          env:
            # Адрес базы и имя пользователя секретами не являются: знание того, что
            # база называется passes-db, само по себе доступа не даёт.
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # ВОТ ЭТУ СТРОКУ И НАШЁЛ АУДИТ.
            # Файл лежит в Git, значит пароль знает каждый, у кого есть доступ
            # к репозиторию, и каждый, кто когда-либо его клонировал.
            - name: DB_PASSWORD
              value: "Propusk2019!"
          # Вечный цикл: раз в десять секунд печатает строку в лог. В лог уходит не сам
          # пароль, а его отпечаток sha256 — первые двенадцать символов. По отпечатку
          # видно, что пароль сменился, но восстановить из него значение нельзя.
          # В настоящих сервисах логи пишут ровно так.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          # Аппетиты крошечные: это демонстрация, а не нагрузка.
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
