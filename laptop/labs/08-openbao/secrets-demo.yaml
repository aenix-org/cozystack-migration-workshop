# Лаба 8 · ступень 3 из 3: пароля в манифесте нет — ни открытым текстом, ни в base64.
# Финальный вариант. Этот файл можно класть в Git, показывать подрядчику и печатать
# на футболке.
#
# Чем эта ступень отличается от второй: там значение всё-таки было записано — в файле
# и затем в объекте кластера. Здесь его в описании нет вовсе; приложение забирает
# пароль само, в момент запуска, из хранилища OpenBao.
#
#   secrets-demo-naive.yaml      пароль видит каждый, кто открыл файл
#   secrets-demo-secret.yaml     пароль вынесен в объект Secret
#   secrets-demo.yaml         <- вы здесь: пароль приезжает из хранилища при запуске
#
# ПЕРЕД ПРИМЕНЕНИЕМ: замените tenant-workshopXX на свой namespace — он входит в адрес
# хранилища ниже. XX — заглушка, а не часть имени.
# Где применяется: ваш кластер `lab` (export KUBECONFIG=~/lab.kubeconfig).
# Команда: kubectl apply -f secrets-demo.yaml
#
# Токен, которым приложение представляется хранилищу, лежит в секрете passes-bao-token.
# Вы создаёте его командой, а не файлом: в этом манифесте есть только имя объекта,
# а имя секретом не является.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # Всё работает не от root. fsGroup нужен потому, что контейнеров здесь два: один
      # пишет файл с паролем, другой его читает. Без общей группы init-контейнер
      # напишет файл, который основной не сможет открыть, и вы полчаса будете думать,
      # где ошиблись.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Место, куда один контейнер положит пароль, а другой его прочитает.
      # medium: Memory означает, что этот «диск» находится в оперативной памяти узла
      # и на настоящий диск не попадает никогда: ни в бэкап, ни в дамп тома, ни к тому,
      # кто заберёт диск из сервера. Исчез под — исчезло и содержимое.
      volumes:
        - name: secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      # init-контейнер отрабатывает ДО основного и обязан завершиться успешно.
      # Не сумеет забрать пароль — приложение не запустится вовсе, и это правильное
      # поведение: сервис без пароля к базе всё равно нерабочий, честнее не подняться,
      # чем подняться и сыпать ошибками в лог.
      initContainers:
        - name: fetch-secret
          # Берём образ самого OpenBao ради одной утилиты `bao` — его клиента.
          # Своего кода писать не нужно.
          image: openbao/openbao:2.5.1
          # bao kv get -field=password — забрать одно поле по одному пути, не весь
          # секрет. tr -d '\n' убирает перевод строки, который иначе попал бы внутрь
          # пароля: лишний символ на конце база не примет, а искать такое неприятно.
          # chmod 0400 — читать файл может только владелец.
          # set -e останавливает скрипт на первой же ошибке: иначе контейнер завершился
          # бы успешно с пустым файлом, и разбираться пришлось бы уже в приложении.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              bao kv get -field=password secret/passes/db \
                | tr -d '\n' > /secrets/db_password
              chmod 0400 /secrets/db_password
              echo "пароль получен из OpenBao, в манифесте его нет"
          # Адрес хранилища и токен, которым приложение доказывает своё право читать.
          # Токен — по ссылке на объект, созданный командой; сюда, в файл, он не попадает.
          # В адресе tenant-workshopXX — та самая заглушка, которую надо заменить.
          env:
            - name: BAO_ADDR
              value: http://openbao-secrets.tenant-workshopXX.svc.cozy.local:8200
            - name: BAO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: passes-bao-token
                  key: token
          # Общая папка. Этому контейнеру она отдана на запись — он в неё пишет.
          volumeMounts:
            - name: secrets
              mountPath: /secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Лимиты выше, чем у основного контейнера: утилита OpenBao тяжелее busybox,
          # но живёт она несколько секунд, так что это не постоянная плата.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      # Основной контейнер запускается только после того, как init-контейнер закончил.
      containers:
        - name: app
          image: busybox:1.36
          # Тот же цикл, что и на прошлых ступенях, но пароль теперь не в переменной
          # окружения, а в файле: отпечаток считается прямо с /secrets/db_password.
          # Переменные окружения видны в выводе kubectl describe pod и уходят в дампы
          # процессов; файл в памяти пода — нет.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(sha256sum /secrets/db_password | cut -c1-12)"
                sleep 10
              done
          # Здесь остались только несекретные настройки — адрес и логин.
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
          # Та же папка, но только на чтение: испортить или подменить пароль
          # приложение не может, даже если очень захочет.
          volumeMounts:
            - name: secrets
              mountPath: /secrets
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
