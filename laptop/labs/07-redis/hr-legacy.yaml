---
# Лаба 7 · заглушка легаси-справочника сотрудников.
# В жизни это чужая система, которую вам не отдадут переписывать: она отвечает 800 мс,
# и с этим надо как-то жить. Здесь — заглушка с тем же поведением, чтобы было что измерять.
#
# Где применяется: ваш кластер `lab` (export KUBECONFIG=~/lab.kubeconfig), не управляющий
# кластер Cozystack. Команда: kubectl apply -f hr-legacy.yaml
#
# HARBOR-HOST — заглушка, а не адрес. Подставьте адрес своего Harbor, иначе кластер пойдёт
# скачивать образ с несуществующего хоста:
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # macOS
#
# В файле два объекта, разделённых строкой `---`: Deployment (кто запускается и в скольких
# копиях) и Service (постоянное имя, по которому в эти копии ходят). У каждого объекта
# apiVersion и kind говорят, что это за объект, а metadata.name — как он называется;
# дальше по файлу эти три поля не комментируются.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-legacy
  labels:
    app: hr-legacy
spec:
  # Сколько копий держать запущенными. Исчезнет копия — кластер создаст новую, не
  # спрашивая. Справочнику хватает одной: он здесь не для нагрузки, а для замера.
  replicas: 1
  # По этой метке Deployment узнаёт свои поды среди всех остальных в кластере.
  # Метка в selector и метка в template ниже обязаны совпадать, иначе объект
  # не найдёт то, что сам же и создал.
  selector:
    matchLabels:
      app: hr-legacy
  # template — шаблон пода. Всё, что ниже, описывает одну копию: из чего её собирать,
  # с какими правами запускать и как понять, что она готова принимать запросы.
  template:
    metadata:
      labels:
        app: hr-legacy
    spec:
      # Требования безопасности уровня пода. Процесс работает не от root (uid 10001),
      # профиль seccomp отсекает системные вызовы, которые приложению не нужны.
      # В кластере с включёнными политиками под без этих полей не запустится вовсе.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Harbor закрыт логином и паролем, и кластеру нужно чем-то представиться. Секрет
      # `harbor` вы завели в лабе про реестр. Без этой ссылки образ не скачается,
      # и под останется в состоянии ImagePullBackOff.
      imagePullSecrets:
        - name: harbor
      containers:
        - name: hr
          # То же, что и на уровне пода, но для конкретного контейнера: запрещаем
          # повышение прав и отбираем все ядровые привилегии. Приложению на Go
          # ни одна из них не нужна.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Образ один и тот же для справочника и для самого сервиса «Пропуск».
          # Кем именно запустится процесс, решает переменная MODE ниже.
          image: HARBOR-HOST/passes/passes-api:v2
          # У порта есть имя, а не только номер: проба готовности и Service ниже
          # ссылаются на имя. Поменяется номер — править придётся в одном месте.
          ports:
            - containerPort: 8080
              name: http
          # Переменные окружения — единственный способ настроить это приложение.
          # Пересобирать образ ради смены поведения не нужно.
          env:
            # MODE=hr — экземпляр притворяется кадровой системой: ждёт и отвечает.
            - name: MODE
              value: "hr"
            # Ровно та задержка, которую показывает настоящий справочник.
            # Меняя её, вы меняете «насколько всё плохо» — попробуйте потом 2s.
            - name: HR_DELAY
              value: "800ms"
            # Своё имя под заранее не знает — его назначает кластер при создании.
            # fieldRef подставляет это имя в переменную уже на старте, и оно
            # попадает в ответ сервиса: видно, какая именно копия ответила.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # requests — сколько ресурсов резервируется под контейнер при выборе узла,
          # limits — потолок, выше которого его не пустят. Похоже на reservation
          # и limit в vSphere, но задаётся на контейнер, а не на виртуальную машину.
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          # Проба готовности. Пока /healthz не ответит, Service не пошлёт в эту копию
          # ни одного запроса. Без пробы трафик пойдёт в ещё не запустившийся процесс,
          # и вы увидите ошибки на ровном месте — при том что «всё развернулось».
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Service — постоянное имя и постоянный адрес для набора подов. Поды пересоздаются
# и каждый раз получают новый IP, а имя hr-legacy остаётся тем же. Похоже на VIP
# балансировщика, но заводится четырьмя строками и живёт внутри кластера.
apiVersion: v1
kind: Service
metadata:
  name: hr-legacy
spec:
  # По этой метке Service набирает список живых копий. Та же метка, что у подов выше:
  # не совпадёт — Service будет существовать и не вести никуда.
  selector:
    app: hr-legacy
  ports:
    # Обращаются по 80-му порту, внутрь пода это уходит на порт с именем http (8080).
    - port: 80
      targetPort: http
