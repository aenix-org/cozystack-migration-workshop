---
# Лаба 7 · рабочее включение кеша. Применяется поверх уже развёрнутого passes-api
# в вашем кластере `lab` (export KUBECONFIG=~/lab.kubeconfig):
#   kubectl patch deployment passes-api --patch-file cache-patch.yaml
#
# Это патч, а не полный манифест: здесь описано только то, что меняется. Всё остальное —
# образ, метки, пробы, ресурсы — остаётся из passes-api.yaml нетронутым. Поэтому файл
# и начинается сразу со spec: путь до контейнера повторяет структуру Deployment, чтобы
# кластер понял, куда именно вносить правку.
#
# Имя контейнера `api` — не украшение, а адрес: по нему кластер находит нужный контейнер
# в списке. Ошибётесь в имени — вместо правки получите второй контейнер.
#
# Подставьте адрес своего Redis вместо REDIS-ADDR — это заглушка, а не имя хоста.
# Адрес вы берёте в дашборде, в карточке своего managed-приложения Redis.
spec:
  template:
    spec:
      containers:
        - name: api
          # Списки env в Kubernetes сливаются по полю name, поэтому три записи ниже
          # добавятся к тем, что уже есть в Deployment, а не заменят их собой.
          env:
            # Появление этой переменной и есть «включить кеш»: приложение проверяет её
            # на старте и, если она задана, ходит сначала в Redis. Пустая или
            # отсутствующая — работает как раньше, через справочник на каждый запрос.
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
            # Пароль не пишем текстом: он приезжает из секрета, который вы
            # создадите отдельной командой. В манифесте, который лежит в Git,
            # паролю не место.
            #
            # secretKeyRef — это ссылка: name — имя объекта-секрета в том же кластере,
            # key — какое поле внутри него взять. Значение подставляется при запуске
            # пода и в файле не появляется никогда.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-password
                  key: password
            # Сколько секунд запись живёт в кеше. Шестьдесят — потому что
            # справочник сотрудников меняется раз в день, а не раз в секунду.
            #
            # Больше срок — реже ходим в справочник, но дольше отдаём устаревшую
            # фамилию. Меньше — данные свежее, выигрыш меньше. Это компромисс,
            # а не настройка с правильным значением.
            - name: CACHE_TTL
              value: "60"
