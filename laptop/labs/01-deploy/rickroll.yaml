# Лаба 1. Всё учебное приложение rickroll одним файлом: настройки nginx, страница,
# само развёртывание и постоянный адрес к нему. Четыре объекта, разделённые `---`.
#
# Применяется на вашем учебном кластере `lab`, а не в тенанте на управляющем кластере:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f rickroll.yaml
# Заглушек вроде tenant-workshopXX здесь нет — подставлять свой номер никуда не нужно.
#
# Поля, которые повторяются у всех четырёх объектов, разбираем один раз здесь:
#   apiVersion — раздел API, в котором живёт этот тип объекта;
#   kind       — сам тип объекта;
#   metadata.name — имя, по которому объект потом ищут через `kubectl get`.
# Имя уникально внутри своего типа, поэтому Deployment и Service ниже оба зовутся
# rickroll и не конфликтуют.
---
# Настройки nginx. Между версиями страницы не меняются, поэтому вынесены отдельно.
# ConfigMap — файл настроек, который лежит в кластере сам по себе и подкладывается
# внутрь контейнера при запуске. Смысл в том, чтобы менять настройки, не пересобирая
# образ. Ключ `default.conf` станет именем файла в каталоге, куда смонтирован том.
#
# Всё, что ниже отступа после `|`, — не YAML, а дословное содержимое файла. Строки
# с решёткой внутри этого блока попадут в конфиг nginx как есть, а не исчезнут при
# разборе. По той же причине в блок со страницей ниже комментарии не добавлены:
# там HTML, и решётка в нём была бы видна пользователю на экране.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-conf
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      location / {
        # Вся соль лабы: nginx подставляет имя своего пода прямо в HTML.
        # $hostname внутри пода — это и есть имя пода.
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }
    }
---
# Страница, версия 1. Отдельным объектом от настроек — чтобы в лабе 4 переключить
# приложение на вторую версию, не трогая конфиг nginx и не пересобирая образ.
# Суффикс -v1 в имени не украшение: рядом появится rickroll-page-v2, и переключение
# тома между ними и будет выкаткой новой версии.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rickroll-page-v1
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Never Gonna Give You Up</title>
    <style>
      body{background:#0d0d12;color:#e8e8ef;font:16px/1.6 system-ui,sans-serif;
           text-align:center;padding:10vh 5vw;margin:0}
      h1{font-size:clamp(30px,7vw,72px);margin:0 0 .25em;font-weight:800;letter-spacing:-.02em;
         background:linear-gradient(90deg,#ff0057,#ffb800,#00e0ff,#ff0057);
         background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
         color:transparent;animation:slide 3s linear infinite}
      @keyframes slide{to{background-position:300% 0}}
      p.lyr{color:#9aa0b5;font-size:clamp(14px,2.2vw,19px);margin:0 0 3em}
      .pod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
           font-size:clamp(13px,2vw,18px);color:#6f7690}
      .pod b{display:block;margin-top:.4em;color:#00e0ff;font-size:1.35em;word-break:break-all}
      .hint{margin-top:3em;color:#4d5366;font-size:14px}
    </style>
    <h1>Never Gonna Give You Up</h1>
    <p class="lyr">Never gonna let you down &middot; Never gonna run around and desert you</p>
    <div class="pod">вас обслужил под<b>__POD__</b></div>
    <p class="hint">Обновите страницу. Когда реплик станет больше — имя начнёт меняться.</p>
    </html>
---
# Само приложение. Deployment описывает желаемое состояние — какой образ запускать,
# сколько копий держать, как их заменять при обновлении. Дальше кластер сам приводит
# реальность к этому описанию и следит за ней постоянно, а не один раз при создании.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rickroll
  labels:
    app: rickroll
spec:
  # Сколько копий держать запущенными. Формулировка именно такая: не «запусти одну»,
  # а «держи одну». Исчезнет копия — кластер создаст новую, не спрашивая. В лабе 3
  # это же поле начнёт менять автомасштабирование, поэтому руками его больше не трогают.
  replicas: 1
  # По какой метке Deployment считает поды своими. Метка здесь и метка в template
  # ниже обязаны совпадать: при расхождении объект не создастся вовсе.
  selector:
    matchLabels:
      app: rickroll
  # Шаблон пода — с него штампуется каждая копия. Правка любого поля внутри template
  # означает новую ревизию приложения и замену копий по очереди (это и есть лаба 4).
  # Правка полей вне template (например, replicas) ревизию не создаёт.
  template:
    metadata:
      labels:
        # Та же метка висит и на самих подах: по ней их находит Service в конце файла.
        app: rickroll
    spec:
      # Требования профиля безопасности `restricted` на уровне всего пода: работа
      # не от root, конкретный UID и стандартный профиль seccomp. В корпоративном
      # кластере с включённым `restricted` под без этих полей не допустят к запуску,
      # причём отказ придёт в момент создания пода, а не при apply манифеста.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # Та же строгость, но на уровне контейнера: процессу внутри запрещено
          # повышать свои права, и у него отобраны все linux-возможности.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Непривилегированный вариант: слушает 8080 и работает не от root.
          # Одного этого хватает профилю `baseline`, но не `restricted` — тому нужны
          # явные securityContext у пода и у контейнера, они заданы выше. В
          # корпоративном кластере обычно включён именно `restricted`.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # По умолчанию nginx поднимает по рабочему процессу на ядро узла. На учебной
          # машине с одним ядром это один процесс, а на боевом узле с 64 ядрами — 64,
          # и под с маленьким лимитом памяти падает с OOMKilled ещё до первого запроса.
          # Автотюн считает воркеры по лимиту CPU: при 300m это один процесс.
          # Через переменную окружения, а не через -g: директива уже есть в базовом
          # конфиге образа, и второе объявление роняет nginx с ошибкой «duplicate».
          env:
            - name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE
              value: "1"
          # Порту дано имя, а не только номер: на `http` ссылаются readinessProbe
          # ниже и targetPort у Service. Поменяется номер — править надо в одном месте.
          ports:
            - containerPort: 8080
              name: http
          # Две разные вещи, которые постоянно путают. requests — сколько ресурса
          # зарезервировать гарантированно; по нему планировщик выбирает узел, и от
          # него же автомасштабирование в лабе 3 считает загрузку в процентах.
          # limits — потолок, выше которого не дают подняться: по процессору при
          # упоре замедляют, по памяти убивают контейнер.
          resources:
            # Намеренно мизерные: на воркшопе таких приложений будет много.
            # 20m — это две сотых ядра. Значение низкое сознательно: чем меньше
            # requests, тем быстрее нагрузка перебивает порог и рост копий в лабе 3
            # видно за секунды, а не за полчаса.
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
          # Проверка готовности. Пока по этому адресу не пришёл ответ, кластер не
          # пускает на копию трафик. Ради неё в конфиге nginx заведён отдельный
          # location /healthz с ответом «ok». Этим полем оплачена выкатка без простоя
          # в лабе 4: старую копию гасят только после того, как новая ответила.
          # Уберите его — и обновление начнёт ронять запросы.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            # Две секунды до первого стука — подобрано опытным путём. Меньше не имеет
            # смысла, nginx столько стартует; больше — растянет каждую выкатку впустую.
            initialDelaySeconds: 2
          # Куда подложить содержимое ConfigMap внутри контейнера. Каталоги выбраны
          # не произвольно: из первого nginx отдаёт файлы, из второго читает настройки.
          # Без этих двух строк оба ConfigMap так и остались бы лежать в кластере,
          # а nginx показал бы свою стандартную страницу.
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
            - name: conf
              mountPath: /etc/nginx/conf.d
      # Какие ConfigMap подключить к поду. Имя тома здесь связывает его с записью
      # в volumeMounts выше — совпадать должны именно имена, порядок для связки роли
      # не играет. А вот для лабы 4 играет, см. предупреждение ниже.
      volumes:
        # ВНИМАНИЕ: этот том должен быть первым (volumes[0]).
        # Лаба 4 переключает версию страницы патчем по индексу.
        # JSON Patch адресует элемент списка номером, а не именем. Переставите тома
        # местами — патч молча подменит настройки nginx вместо страницы, приложение
        # сломается, а сообщение об ошибке будет говорить совсем о другом.
        - name: page
          configMap:
            name: rickroll-page-v1
        - name: conf
          configMap:
            name: rickroll-conf
---
# Постоянный адрес приложения. Копии рождаются и умирают, их адреса меняются, а имя
# `rickroll` внутри кластера остаётся прежним — по нему приложение и зовут соседи.
# Список живых копий за этим именем кластер ведёт сам, по меткам.
apiVersion: v1
kind: Service
metadata:
  name: rickroll
spec:
  # Кого поставить за этот адрес: все поды с такой меткой, кем бы они ни были
  # созданы. Отсюда типичная неприятность — посторонний под с меткой app: rickroll
  # молча попадёт в балансировку и начнёт отвечать вашим пользователям. Скрипт
  # check.sh в этой папке отдельно проверяет, что таких самозванцев нет.
  selector:
    app: rickroll
  ports:
    # port — на каком порту отвечает сам сервис, targetPort — куда он стучится внутрь
    # пода. Здесь targetPort задан именем порта из контейнера, а не числом: поменяется
    # номер в контейнере — этот файл править не придётся.
    - port: 80
      targetPort: http
