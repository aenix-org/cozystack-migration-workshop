---
# Лаба 12. Отдаём учебное приложение rickroll наружу, чтобы до него достучалась
# виртуальная машина, поднятая в тенанте.
#
# Применяется на учебном кластере `lab` — там же, где работает само приложение,
# а не в тенанте:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f rickroll-lb.yaml
# Заглушек вроде tenant-workshopXX здесь нет — подставлять свой номер никуда не нужно.
#
# Отдельным объектом, а не правкой основного Service: адрес нужен ровно на одну
# лабу, и удалить его потом должно быть одной командой.
#
# Приложение из лабы 1 должно работать: без подов с меткой app: rickroll адрес
# выдадут, но отвечать по нему будет некому.
apiVersion: v1
kind: Service
metadata:
  name: rickroll-lb
spec:
  # Ради этой строки файл и существует. LoadBalancer означает «попроси у платформы
  # адрес за пределами кластера»: драйвер платформы заводит объект-адрес в вашем
  # тенанте, рядом с виртуалками, и возвращает его в колонку EXTERNAL-IP. Заявку
  # никуда подавать не надо, адрес приходит за секунды.
  # «Внешний» здесь значит «внешний по отношению к кластеру lab», а не «видимый из
  # интернета»: адрес принадлежит сети тенанта — оттуда его и видит виртуальная машина.
  type: LoadBalancer
  # Кого поставить за этот адрес: все поды с такой меткой. Метка та же, что у основного
  # сервиса приложения, поэтому оба адреса ведут в одни и те же поды.
  selector:
    app: rickroll
  ports:
    # port — на каком порту отвечает сам адрес, targetPort — куда он стучится внутрь пода.
    # targetPort задан именем порта из rickroll.yaml, а не числом: поменяется номер
    # в контейнере — этот файл править не придётся.
    - port: 80
      targetPort: http
