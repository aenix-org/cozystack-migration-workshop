---
# Лаба 5 · Инфраструктура в Git. Задание: что именно из репозитория применять в кластер.
#
# Применяется на вашем кластере `lab` вместе с соседним gitrepository.yaml:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# В каждом объекте: apiVersion — версия схемы описания, kind — что создаём,
# metadata.name — имя объекта. Ниже отдельно не поясняются.
#
# Разделение обязанностей: GitRepository скачивает репозиторий и ничего не применяет,
# этот объект берёт скачанное и приводит к нему кластер. Имя Kustomization совпадает
# с именем утилиты kustomize, но это разные вещи — здесь это объект в кластере.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: passes
  # Живёт там же, где службы Flux, — иначе kustomize-controller его не подхватит.
  namespace: flux-system
spec:
  # Как часто сверять фактическое состояние кластера с описанным в Git.
  # Это не «раз в минуту применить заново» — это «раз в минуту сравнить и
  # исправить расхождения». Даже если в Git ничего не менялось, правка, сделанная
  # руками через kubectl edit, будет молча откачена назад. Разницу вы увидите
  # чуть дальше по лабе, когда сами поменяете что-нибудь в кластере мимо Git.
  interval: 1m
  # Папка внутри репозитория. Всё, что лежит в ней, попадёт в кластер; файлы рядом
  # с ней — например README.md в корне — не тронутся. Имя `apps` выбрано нами, но оно
  # должно совпадать с папкой, в которую вы кладёте манифесты в своём репозитории.
  path: ./apps
  # Удалять из кластера объекты, которые исчезли из Git.
  # Без этого Git перестаёт быть полным описанием: удалённое из репозитория
  # продолжало бы работать в кластере, и никто бы об этом не знал.
  prune: true
  # На какой источник смотреть. Имя `passes` — это metadata.name из gitrepository.yaml,
  # а не имя репозитория на GitHub. Переименуете там — поправьте и здесь, иначе Flux
  # будет ждать источник, которого нет, и Kustomization не станет готовым.
  sourceRef:
    kind: GitRepository
    name: passes
  # Дожидаться готовности применённого, а не отчитываться сразу после apply.
  # Разница ровно та же, что между «заявку отправил» и «заявка выполнена»: без wait
  # Flux сообщит об успехе, даже если поды после этого не поднимутся.
  wait: true
  # Сколько ждать этой готовности, прежде чем признать применение неуспешным.
  # Три минуты — с запасом на скачивание образа на пустом узле. Слишком маленькое
  # значение даст ложные отказы на медленной сети, слишком большое — вы будете
  # долго смотреть на «в процессе» вместо внятной ошибки.
  timeout: 3m
