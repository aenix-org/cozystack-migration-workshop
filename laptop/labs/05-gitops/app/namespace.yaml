---
# Лаба 5 · Инфраструктура в Git. Пространство имён под сервис «Пропуск».
#
# Руками этот файл в кластер не применяется. Вы кладёте его в свой репозиторий на
# GitHub, в папку apps/, а в кластер `lab` его переносит Flux — сам, по расписанию:
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# Как читать любой манифест: apiVersion — версия схемы описания (по ней кластер знает,
# как его разбирать), kind — что создаём, metadata.name — имя, по которому объект потом
# искать. Эти три поля есть в каждом объекте и ниже отдельно не поясняются.
#
# Пространство имён (namespace) — логическая перегородка внутри одного кластера:
# своя область видимости имён, свои права, свои квоты. Ближайшее в vSphere — папка
# в дереве vCenter или resource pool.
#
# Зачем оно лежит в Git вместе с приложением, а не создано руками: когда сервис уедет
# из репозитория, Flux уберёт и пространство имён. Не останется пустой перегородки,
# про которую через полгода никто не вспомнит, зачем она заводилась.
apiVersion: v1
kind: Namespace
metadata:
  name: passes
  # Метка на работу сервиса не влияет — она нужна, чтобы одной командой найти всё,
  # что относится к «Пропуску»: kubectl get all -A -l app.kubernetes.io/part-of=passes.
  # Имя part-of взято из общепринятого набора меток Kubernetes, а не придумано нами:
  # чужие инструменты (мониторинг, выгрузки) ищут именно его.
  labels:
    app.kubernetes.io/part-of: passes
