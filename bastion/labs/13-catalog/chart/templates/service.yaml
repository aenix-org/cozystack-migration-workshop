# Лаба 13. Шаблон Service: постоянный адрес приложения.
#
# Копии приложения приходят и уходят, их адреса каждый раз новые. Service даёт имя,
# которое не меняется, и раскидывает запросы по живым копиям. Из соседнего пода
# к приложению обращаются по имени релиза.
#
# О подстановке в двойных фигурных скобках и о том, откуда берутся имена объектов,
# написано в templates/deployment.yaml — здесь всё устроено так же.
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Один флаг в values решает, получит приложение адрес за пределами кластера или нет.
  # Так же устроены штатные приложения Cozystack: поле external.
  # Конструкция if/else выбирает одно из двух значений при рендере — в готовый манифест
  # уходит либо LoadBalancer, либо ClusterIP, и ветвления в нём уже не остаётся.
  type: {{ if .Values.external }}LoadBalancer{{ else }}ClusterIP{{ end }}
  # Кому отдавать трафик. Service отбирает поды по меткам, а не по именам, поэтому
  # ему всё равно, сколько копий и как они называются. Метки те же, что Deployment
  # ставит своим копиям.
  selector:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
  # port — на каком порту слушает сам Service, targetPort — куда он стучится внутрь пода.
  # targetPort записан именем: порт с именем http объявлен в шаблоне Deployment.
  # Поменяется номер там — здесь править не придётся.
  ports:
    - name: http
      port: 80
      targetPort: http
