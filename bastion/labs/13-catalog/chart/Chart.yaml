# Лаба 13. Паспорт чарта «Пропуска».
#
# Чарт — это папка: шаблоны манифестов в templates/, значения по умолчанию в values.yaml
# и схема параметров в values.schema.json. Разворачивается командой
# `helm install <имя-релиза> chart` из папки лабы, а в каталоге Cozystack — самой
# платформой, когда кто-то заказывает приложение через дашборд.
#
# Chart.yaml — обложка пакета: по ней Helm понимает, как пакет называется и какой он версии.
apiVersion: v2
name: guest-pass
description: Internal guest pass service — order a pass for a visitor
type: application

# Дальше две версии, и их путают чаще всего остального в Helm. Это разные вещи.
#
# version — версия упаковки. Меняется, когда вы правите шаблоны, значения или схему,
# даже если приложение внутри осталось прежним. Именно её Helm сравнивает при обновлении
# релиза, по ней же различаются загруженные в репозиторий пакеты. Без её повышения
# платформа считает, что пакет не менялся, и новую версию можно не заметить.
version: 0.1.0
# appVersion — версия самого приложения внутри пакета, здесь это nginx. Живёт своей
# жизнью: приложение может обновиться десять раз без единой правки шаблонов, и наоборот —
# вы переписали шаблоны, а приложение то же. В имена объектов не попадает, показывается
# в выводе `helm list` и в карточке каталога.
appVersion: "1.0"
