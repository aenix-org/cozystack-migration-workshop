# Лаба 13. Значения по умолчанию для чарта «Пропуска».
#
# Это ответы на вопросы, которые чарт задаёт при разворачивании: сколько копий, какой
# текст на странице, нужен ли адрес снаружи. Здесь они записаны на случай «ничего не
# выбирали». Тот, кто заказывает приложение, их переопределяет: в дашборде — полями формы,
# в терминале — ключом `--set replicas=5` или своим файлом `helm install ... -f my.yaml`.
# Правка этого файла меняет умолчания для будущих заказов, а не для уже развёрнутых.
#
# Как значения отсюда превращаются в форму заказа в дашборде:
#   тип        — какое поле показать: {int} число, {bool} переключатель,
#                {string} строка ввода, {struct} вложенная группа полей;
#   Описание   — подпись поля и подсказка под ней;
#   =значение  — что уже стоит в поле, когда форму открыли;
#   обязательность — задаётся списком required в схеме. Здесь его нет: у каждого
#                параметра есть значение по умолчанию, поэтому пропустить можно любое поле.
# Поэтому описания пишутся по-английски: их читает не только автор чарта, но и любой,
# кто заказывает приложение в дашборде.

## Комментарии вида `## @param` — не украшение. По ним генератор Cozystack
## (cozyvalues-gen) собирает values.schema.json и таблицу параметров в README.
## Формат: ## @param {тип} имя=значение-по-умолчанию - Описание.

# Сколько копий приложения держать запущенными. Одна копия — простой на время
# перезапуска узла, две переживают потерю любой из них.
## @param {int} replicas=2 - Number of application replicas.
replicas: 2

# Текст на главной странице. Вынесен в параметры, потому что у каждой дочерней компании
# он свой, а собирать ради этого отдельный образ никто не станет.
## @param {string} greeting=Order a pass for your guest - Text shown on the main page.
greeting: "Order a pass for your guest"

# Нужен ли приложению адрес за пределами кластера. Соглашение каталога Cozystack:
# поле с именем external означает у всех приложений одно и то же — внешний доступ.
## @param {bool} external=false - Enable external access from outside the cluster.
external: false

# Размер одной копии. Вынесен отдельной группой полей, чтобы в форме заказа это
# выглядело как один блок «ресурсы», а не как два несвязанных поля.
## @typedef {struct} Resources - CPU and memory for each replica.
## @field {quantity} cpu - CPU available to each replica.
## @field {quantity} memory - Memory (RAM) available to each replica.

## @param {Resources} resources - Explicit CPU and memory configuration.
resources:
  cpu: 100m
  memory: 128Mi
