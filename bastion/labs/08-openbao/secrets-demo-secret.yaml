# Лаба 8 · ступень 2 из 3: пароль вынесен из Deployment в отдельный объект Secret.
# «Наивная починка»: в описании приложения пароля больше не видно, разработчик доволен,
# аудитор — нет. Почему — увидим через одну команду.
#
# Чем эта ступень лучше первой: значение перестало быть частью описания приложения,
# на него теперь ссылаются по имени. Чем она хуже третьей — в том, что значение всё
# равно приходится где-то написать, и написано оно прямо здесь.
#
#   secrets-demo-naive.yaml      пароль видит каждый, кто открыл файл
#   secrets-demo-secret.yaml  <- вы здесь: пароль в объекте Secret
#   secrets-demo.yaml            пароля в манифесте нет вообще
#
# Где применяется: ваш кластер `lab` (export KUBECONFIG=~/lab.kubeconfig).
# Команда: kubectl apply -f secrets-demo-secret.yaml
#
# Пароль в этом файле учебный и выдуманный. В файле два объекта, разделённых строкой
# `---`: Secret и Deployment, который на него ссылается. apiVersion, kind
# и metadata.name дальше по файлу не комментируются.
#
# Secret — отдельный вид объекта для того, что не должно лежать в описании приложения.
# Кластер обращается с ним чуть аккуратнее, чем с обычными настройками: значения
# не показываются в kubectl describe, права на чтение раздаются отдельно.
apiVersion: v1
kind: Secret
metadata:
  name: passes-db
# Opaque означает «произвольный набор ключ-значение». Бывают специальные типы —
# для доступа к реестру образов, для TLS-сертификатов, — но здесь ничего
# специального не нужно.
type: Opaque
data:
  # Это НЕ шифрование. Это base64 — способ записать байты печатными символами.
  # Ключа нет, пароля на расшифровку нет, обратное преобразование делает любой.
  password: UHJvcHVzazIwMTkh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secrets-demo
  labels:
    app: secrets-demo
spec:
  # Deployment ниже — тот же самый, что и на первой ступени. Изменилось ровно одно
  # место: как в под попадает DB_PASSWORD.
  replicas: 1
  selector:
    matchLabels:
      app: secrets-demo
  template:
    metadata:
      labels:
        app: secrets-demo
    spec:
      # Не от root, ограниченный набор системных вызовов.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Снова busybox и несколько строк на shell: смотрим на путь пароля,
          # а не на работу приложения.
          image: busybox:1.36
          env:
            - name: DB_HOST
              value: passes-db.internal
            - name: DB_USER
              value: passes_app
            # Вот вся разница с первой ступенью. valueFrom вместо value означает
            # «взять значение оттуда»: secretKeyRef.name — какой объект, key — какое
            # поле внутри него. Подстановка происходит при запуске пода, в описании
            # приложения остаётся только имя.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: passes-db
                  key: password
          # Тот же цикл, что и на первой ступени: печатает отпечаток пароля, а не сам
          # пароль. Отпечаток удобен как раз для сравнения ступеней — если он не
          # изменился, значит в под приехало то же самое значение, что и раньше.
          command: ["/bin/sh", "-c"]
          args:
            - |
              while :; do
                printf '%s подключаюсь к %s как %s, отпечаток пароля sha256:%s\n' \
                  "$(date -u +%H:%M:%S)" "$DB_HOST" "$DB_USER" \
                  "$(printf %s "$DB_PASSWORD" | sha256sum | cut -c1-12)"
                sleep 10
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
