# Лаба 8 · заказ хранилища секретов OpenBao.
# То же самое, что вы закажете мышкой в дашборде — только текстом.
# Применяется НЕ в лабораторный кластер, а в тенант на управляющем кластере:
#   kubectl --kubeconfig="$HOME/.kube/config" apply -f openbao.yaml
#
# ПЕРЕД ПРИМЕНЕНИЕМ: замените tenant-workshopXX на свой namespace. XX — заглушка,
# а не часть имени; свой номер вы получили вместе с паролем. Уйдёт в чужой тенант —
# получите отказ в доступе, и это лучший из возможных исходов.
#
# kind: OpenBAO — это не встроенный объект Kubernetes, а тип, который добавляет
# Cozystack. Вы описываете, что вам нужно, платформа сама разворачивает поды, диски
# и сервисы и дальше сама их обновляет. Ближе всего к заказу услуги по каталогу,
# а не к установке софта на выданную виртуалку.
apiVersion: apps.cozystack.io/v1alpha1
kind: OpenBAO
metadata:
  # Имя влияет не только на карточку в дашборде: внутренний адрес хранилища
  # собирается из него — openbao-secrets.<namespace>.svc.cozy.local. Переименуете —
  # правьте адрес в secrets-demo.yaml и в переменной BAO_APP для check.sh.
  name: secrets
  namespace: tenant-workshopXX
spec:
  # Одна копия. В проде ставят три и получают Raft-репликацию: чарт включает
  # её сам, как только replicas > 1. Переключение туда-обратно требует
  # переноса данных, поэтому решение принимают до, а не после.
  replicas: 1
  # Диск под данные хранилища. Два гигабайта — с запасом: секреты весят байты,
  # место уходит на историю версий и журнал аудита. Уменьшить том после создания
  # нельзя, увеличить обычно можно, поэтому мелочиться здесь незачем.
  size: 2Gi
  # Класс хранения replicated означает, что данные лежат в нескольких копиях на
  # разных узлах. Отказ узла не уносит с собой все ваши пароли — а восстанавливать
  # хранилище секретов из бэкапа мероприятие отдельно неприятное.
  storageClass: replicated
  # Готовый набор «сколько процессора и памяти». Платформа предлагает их списком,
  # чтобы не заставлять каждого считать запросы и лимиты вручную.
  resourcesPreset: t1.small
  # Веб-интерфейс поднимается внутри кластера. Наружу мы его не выставляем:
  # external: true повесил бы LoadBalancer, а нам он в лабе не нужен.
  ui: true
  external: false
