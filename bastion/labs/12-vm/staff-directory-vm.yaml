---
# Лаба 12. Виртуальная машина под легаси-справочник сотрудников: диск и сама машина,
# два объекта в одном файле, разделены строкой `---`.
#
# Это тенантные объекты: они живут НЕ в кластере `lab`, а в вашем namespace
# на управляющем кластере. Kubeconfig нужен тенантный.
#
# Перед применением замените tenant-workshopXX на свой namespace, иначе заказ уедет
# не в ваш тенант.
#
#     export KUBECONFIG=~/.kube/config
#     kubectl apply -f staff-directory-vm.yaml
#
# То же самое делается мышкой в дашборде тенанта (Создать приложение -> VM Disk,
# затем VM Instance) — результат одинаковый.
#
# ВНИМАНИЕ: имя, по которому машину зовут дальше, НЕ совпадает с metadata.name, и это не
# опечатка в лабе. Объект VMInstance с именем X платформа разворачивает чартом
# `vm-instance`, а имя чарта склеивается с именем релиза: запущенный экземпляр
# называется vm-instance-X. Плюс к тому цель указывается с префиксом типа, потому что
# тенантные права выданы на экземпляры (virtualmachineinstances, они же vmi), а не на
# virtualmachines, — голое имя вернёт forbidden. Отсюда команда входа в консоль:
#     virtctl console --namespace=tenant-workshopXX vmi/vm-instance-spravochnik
# Список запущенных экземпляров: kubectl get vmi -n tenant-workshopXX
# А `kubectl get vminstance spravochnik` показывает не экземпляр, а ваш заказ на него —
# тот самый объект, который описан ниже.
#
# Диск и машина — ДВА РАЗНЫХ объекта, и это не бюрократия: диск переживает
# машину. Машину можно удалить и создать заново, подцепив тот же диск.
apiVersion: apps.cozystack.io/v1alpha1
kind: VMDisk
metadata:
  name: spravochnik
  namespace: tenant-workshopXX
spec:
  source:
    image:
      # Имя из общей коллекции образов платформы, не URL.
      # Список видно в дашборде при создании диска.
      name: ubuntu-22.04
  # Размер диска. Он не может быть меньше образа-источника: ubuntu-22.04 разворачивается
  # в 20Gi, и диск на 10Gi платформа отказалась бы наполнить. Диск потом расширяется,
  # но не уменьшается, поэтому занизить здесь дороже, чем завысить.
  storage: 20Gi
  # Класс хранилища. `replicated` — данные пишутся в несколько копий на разные узлы
  # платформы: узел с копией может умереть, машина продолжит работать. По смыслу это
  # зеркало, только собранное по сети. Тот же класс берут базы данных в соседних лабах.
  storageClass: replicated
---
apiVersion: apps.cozystack.io/v1alpha1
kind: VMInstance
metadata:
  name: spravochnik
  namespace: tenant-workshopXX
spec:
  # 1 процессор, 4 ГБ. Тот же справочник каталога, из которого берутся
  # размеры узлов Kubernetes: машины и узлы здесь меряются одинаково.
  instanceType: u1.medium
  # Профиль гостевой ОС: какие драйверы и устройства подсунуть машине.
  instanceProfile: ubuntu
  # Always означает «держать включённой»: выключится сама — включат снова.
  # Halted — выключена, Manual — как оставили.
  runStrategy: Always
  # Какие диски подключить к машине. Ссылка идёт по имени объекта VMDisk выше — того
  # самого, который переживёт эту машину.
  disks:
    - name: spravochnik
  # Обратите внимание: поля replicas здесь НЕТ и не будет.
  # Виртуальная машина — это один объект. Нужны две машины — два объекта
  # с разными именами. Это принципиальное отличие от Deployment,
  # см. раздел README про то, где эта разница болит.
  # Первичная настройка гостевой ОС. cloud-init — штатный механизм облачных образов
  # Linux: при первом запуске машина читает этот текст и применяет его к себе. По роли
  # это кастомизация гостя в vSphere — пароли, файлы, службы, — только описанием, а не
  # мастером. Всё, что ниже отступа после `|`, уезжает в гостя дословно и разбирается
  # уже там, а не Kubernetes.
  #
  # Здесь cloud-init делает справочник сервером: кладёт HTML-страницу и заводит службу,
  # которая отдаёт её по HTTP на порту 8080. python3 уже есть в образе ubuntu — интернет
  # для этого не нужен. Порт 8080 не случайный: ведущий заранее создал в вашем тенанте
  # Service `spravochnik-http` (80 -> 8080) и Ingress `spravochnik`, и как только служба
  # внутри машины поднимется, справочник опубликуется на домене тенанта.
  cloudInit: |
    #cloud-config
    # Пароль нужен, чтобы войти в консоль из дашборда. На рабочей машине
    # так делать не надо — там sshKeys.
    password: ubuntu
    chpasswd: { expire: false }
    ssh_pwauth: true
    write_files:
      - path: /opt/directory/index.html
        content: |
          <!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Справочник</title></head><body><h1>Справочник сотрудников</h1><ul><li>Иванов И. — 101</li><li>Петров П. — 102</li></ul></body></html>
      - path: /etc/systemd/system/directory.service
        content: |
          [Unit]
          Description=Staff directory
          After=network.target
          [Service]
          ExecStart=/usr/bin/python3 -m http.server 8080 --bind 0.0.0.0 --directory /opt/directory
          Restart=always
          [Install]
          WantedBy=multi-user.target
    runcmd: [ "systemctl daemon-reload", "systemctl enable --now directory" ]
