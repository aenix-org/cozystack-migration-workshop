---
# Лаба 11. Бакет под собранные APK.
#
# Бакет — именованная область в объектном хранилище: файлы кладут и забирают целиком,
# по HTTP, и никуда не монтируют. Каталогов внутри нет, слэш в имени объекта рисуется
# деревом только в интерфейсе.
#
# Это тенантный объект: он живёт НЕ в кластере `lab`, а в вашем namespace
# на управляющем кластере. Поэтому kubeconfig здесь нужен тенантный,
# а не тот, которым вы работаете с кластером `lab`. Так и задумано: артефакты сборки
# должны пережить кластер, в котором собирались.
#
# Перед применением замените tenant-workshopXX на свой namespace, иначе заказ уедет
# не в ваш тенант и, скорее всего, не пройдёт по правам.
#
#     export KUBECONFIG=~/.kube/config
#     kubectl apply -f bucket.yaml
#
# То же самое делается мышкой в дашборде тенанта (Создать приложение -> Bucket).
# Результат одинаковый; разница в том, что текст можно отревьюить и положить в Git.
#
# Что произойдёт после применения: платформа поднимет бакет за несколько секунд
# и выпустит ключи доступа, сложив их в секрет bucket-builds-ci-credentials в том же
# namespace. Четыре значения оттуда (endpoint, bucketName, accessKey, secretKey)
# переносятся в кластер `lab` руками — кластеры разные, само ничего не переедет.
apiVersion: apps.cozystack.io/v1alpha1
kind: Bucket
metadata:
  # Имя объекта Cozystack, и только его. Настоящее имя бакета в хранилище платформа
  # выдаёт сама — длинное, вида bucket-a9209f83-... Оно попадёт в поле bucketName
  # выпущенного секрета, и в сборку подставлять надо именно его, а не `builds`.
  name: builds
  namespace: tenant-workshopXX
spec:
  users:
    # Каждый ключ этой карты — отдельный пользователь S3 со своей парой ключей.
    # Пустой объект означает «полный доступ на чтение и запись».
    # Так можно выдать сборщику запись, а мобильной команде — только чтение:
    #   ci: {}
    #   mobile:
    #     readonly: true
    ci: {}
