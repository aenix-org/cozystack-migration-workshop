# Лаба 3. Генератор нагрузки Fortio: сам генератор и постоянный адрес к его
# веб-интерфейсу. Два объекта, разделённые `---`.
#
# Применяется на вашем учебном кластере `lab`, а не в тенанте на управляющем кластере:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f fortio.yaml
# Заглушек вроде tenant-workshopXX здесь нет — подставлять свой номер никуда не нужно.
# Этот же файл понадобится в лабе 4: `kubectl apply -f ../03-scale/fortio.yaml`.
#
# Общие поля манифеста (apiVersion, kind, metadata.name, selector, template,
# securityContext) построчно разобраны в ../01-deploy/rickroll.yaml и здесь
# не повторяются. Комментируем только то, что своё именно у генератора нагрузки.
---
# Генератор нагрузки с веб-мордой.
# Взят вместо hey/ab намеренно: нагрузку запускают кнопкой в браузере,
# а гистограмму задержек видно там же. На прошлых воркшопах мы теряли
# людей именно на консольных инструментах.
#
# Fortio живёт в кластере как обычное приложение и бьёт по адресу rickroll изнутри.
# Нагружать снаружи, с виртуалки, было бы честнее по трафику, но упиралось бы в канал
# до кластера, и вы измеряли бы свой Wi-Fi, а не приложение.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  # Одной копии генератора хватает: нагрузку она даёт в много потоков сама.
  # Вторая копия здесь только размыла бы картину — счётчики в веб-интерфейсе
  # у каждой копии свои, и вы видели бы половину запросов.
  replicas: 1
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      # Тот же профиль безопасности, что и у rickroll: работа не от root, конкретный
      # UID, стандартный seccomp. Оставлено намеренно — чтобы файл можно было применить
      # и в кластере с включённым профилем `restricted`, где иначе под не запустится.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Тег latest — сознательное упрощение для воркшопа, чтобы не сверять версии.
          # В рабочем кластере так не делают: образ под этим тегом может незаметно
          # смениться между двумя apply, и вы не сможете повторить вчерашний результат.
          image: fortio/fortio:latest
          # Режим `server` поднимает веб-интерфейс и держит его. Без этого аргумента
          # Fortio отработал бы один прогон из командной строки и завершился, а кластер
          # перезапускал бы контейнер по кругу.
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            # Запрос выше, чем у самого rickroll (20m): генератору нужно место на узле
            # заранее, иначе планировщик поставит его впритык и разгон будет неровным.
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # Генератору нужен запас по процессору, иначе он упрётся
              # в себя и вы будете нагружать не приложение, а Fortio.
              cpu: "1"
              memory: 256Mi
---
# Постоянный адрес генератора внутри кластера. Нужен, чтобы открыть веб-интерфейс
# с виртуалки через `kubectl port-forward svc/fortio 8081:8080` — снаружи кластер
# ничего не публикует, и других дверей к Fortio нет.
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  ports:
    # 8080 с обеих сторон: и сервис, и контейнер. Номер тот же, что и у rickroll
    # внутри пода, но пересечения нет — у каждого пода свой сетевой стек.
    - port: 8080
      targetPort: http
