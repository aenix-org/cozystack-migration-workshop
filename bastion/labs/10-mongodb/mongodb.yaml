# Лаба 10 · заказ базы MongoDB под пропуска разной формы.
# Описание того, что вы хотите получить; собирает и настраивает сервис платформа.
# То же самое, что вы закажете мышкой в дашборде — только текстом.
# Применяется НЕ в лабораторный кластер, а в тенант на управляющем кластере:
#   kubectl --kubeconfig="$HOME/.kube/workshop" apply -f mongodb.yaml
#
# ПЕРЕД ПРИМЕНЕНИЕМ: замените tenant-workshopXX на свой namespace,
# а ЗдесьВашПароль — на пароль, который вы придумаете.
apiVersion: apps.cozystack.io/v1alpha1
kind: MongoDB
metadata:
  name: passes
  namespace: tenant-workshopXX
spec:
  # Одна копия. MongoDB рассчитана на набор реплик из трёх: они голосуют, кто
  # главный, и переживают потерю одной. С одной копией голосовать не с кем,
  # и чарт включает для этого отдельный «небезопасный» режим. Для лабы годится,
  # для прода — нет.
  replicas: 1
  # Диск под данные. Четырём учебным документам хватит и мегабайта, но том потом
  # проще взять с запасом, чем расширять.
  size: 5Gi
  # replicated — тома, у которых есть копия на другом узле кластера: узел выпал,
  # данные остались.
  storageClass: replicated
  # Процессор и память, выделенные поду базы. Для четырёх документов с избытком.
  resourcesPreset: s1.small
  # Ветка MongoDB. Менять её задним числом на живой базе нельзя без обновления.
  version: v8
  # false — база доступна только изнутри кластера, наружу порт не выставляется.
  # Ходить в неё вы будете из рабочего пода, запущенного рядом.
  external: false
  # Шардирование разрезает данные между несколькими наборами серверов. Нужно, когда
  # данные не помещаются на один сервер; четыре пропуска помещаются.
  sharding: false
  # Пользователь базы и его пароль. Пароль придумайте свой и запомните: он нужен
  # рабочему поду (в строке подключения MONGO_URI) и скрипту проверки
  # (переменная MONGO_PASSWORD). Учётная запись заводится в служебной базе admin —
  # поэтому в строке подключения обязателен authSource=admin.
  users:
    passapp:
      password: ЗдесьВашПароль
  # База passes и права в ней: пользователю passapp выдана роль admin этой базы,
  # то есть он может читать, писать, строить индексы и менять настройки коллекций.
  # Права на другие базы это не даёт.
  databases:
    passes:
      roles:
        admin:
          - passapp
  # Резервные копии в объектное хранилище. На учебном стенде выключены.
  backup:
    enabled: false
