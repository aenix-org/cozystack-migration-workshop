---
# Лаба 11. Бакет под сборки мобильного приложения.
#
# Это тенантный объект: он живёт НЕ в кластере `lab`, а в вашем namespace
# на управляющем кластере. Поэтому kubeconfig здесь нужен тенантный,
# а не тот, которым вы работаете с кластером `lab`.
#
# Перед применением замените tenant-workshopXX на свой namespace.
apiVersion: apps.cozystack.io/v1alpha1
kind: Bucket
metadata:
  name: builds
  namespace: tenant-workshopXX
spec:
  users:
    # Каждый ключ этой карты — отдельный пользователь S3 со своей парой ключей.
    # Пустой объект означает «полный доступ на чтение и запись».
    # Так можно выдать сборщику запись, а мобильной команде — только чтение:
    #   ci: {}
    #   mobile:
    #     readonly: true
    ci: {}
