# Лаба 9 · заказ базы ClickHouse под аналитику по журналу проходов.
# Описание того, что вы хотите получить; собирает и настраивает сервис платформа.
# То же самое, что вы закажете мышкой в дашборде — только текстом.
# Применяется НЕ в лабораторный кластер, а в тенант на управляющем кластере:
#   kubectl --kubeconfig="$HOME/.kube/workshop" apply -f clickhouse.yaml
#
# ПЕРЕД ПРИМЕНЕНИЕМ: замените tenant-workshopXX на свой namespace,
# а ЗдесьВашПароль — на пароль, который вы придумаете.
apiVersion: apps.cozystack.io/v1alpha1
kind: ClickHouse
metadata:
  name: analytics
  namespace: tenant-workshopXX
spec:
  # Одна копия и один шард. В проде держат минимум две копии, иначе потеря узла
  # означает недоступность данных, — но нам нужен миллион строк, а не отказо-
  # устойчивость, и лишняя копия просто съела бы ресурсы стенда.
  replicas: 1
  shards: 1
  # Диск под данные таблиц. Миллион строк из этой лабы займёт десятки мегабайт:
  # колоночное хранение со словарями сжимает такой журнал очень сильно.
  size: 5Gi
  # Отдельный диск под системные журналы сервера, включая журнал запросов.
  logStorageSize: 2Gi
  # Через сколько дней выбрасывать журнал запросов. Мы будем в него смотреть.
  logTTL: 15
  # replicated — тома, у которых есть копия на другом узле кластера: узел выпал,
  # данные остались.
  storageClass: replicated
  # 1 процессор, 4 ГБ. ClickHouse считает в памяти, и на группировках по
  # миллиону строк это заметно.
  resourcesPreset: u1.small
  # Пользователь базы и его пароль. Пароль придумайте свой и запомните: он нужен
  # рабочему поду (переменная CH_AUTH) и скрипту проверки (переменная CH_PASSWORD).
  # После создания его видно в дашборде, в секрете clickhouse-analytics-credentials.
  users:
    analyst:
      password: ЗдесьВашПароль
  # Резервные копии в объектное хранилище. Данные здесь сгенерированные,
  # восстанавливать нечего — на учебном стенде выключено.
  backup:
    enabled: false
  # Keeper нужен для согласования между копиями. Копия одна — согласовывать
  # не с кем, а три пода Keeper заняли бы ресурсы впустую.
  clickhouseKeeper:
    enabled: false
