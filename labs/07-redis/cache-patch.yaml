---
# Включение кеша. Патч, а не полный манифест: так видно ровно то, что меняется.
#
# Списки env в Kubernetes сливаются по полю name, поэтому три записи ниже
# добавятся к тем, что уже есть в Deployment, а не заменят их собой.
#
# Подставьте адрес своего Redis вместо REDIS-ADDR.
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
            # Пароль не пишем текстом: он приезжает из секрета, который вы
            # создадите отдельной командой. В манифесте, который лежит в Git,
            # паролю не место.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-password
                  key: password
            # Сколько секунд запись живёт в кеше. Шестьдесят — потому что
            # справочник сотрудников меняется раз в день, а не раз в секунду.
            - name: CACHE_TTL
              value: "60"
