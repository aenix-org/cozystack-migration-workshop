---
# Сервис «Пропуск», версия v2. Кеша тут пока нет: сначала измеряем, как плохо.
#
# Перед применением подставьте адрес своего Harbor вместо HARBOR-HOST.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: passes-api
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          image: HARBOR-HOST/passes/passes-api:v2
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MODE
              value: "api"
            - name: APP_VERSION
              value: "v2"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # Куда ходить за данными. Имя сервиса, а не адрес: копии справочника
            # могут пересоздаваться сколько угодно, имя не меняется.
            - name: HR_URL
              value: "http://hr-legacy.default.svc.cluster.local"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  selector:
    app: passes-api
  ports:
    - port: 80
      targetPort: http
