---
# Лаба 7 · ЭТОТ ПАТЧ НАМЕРЕННО НЕПОЛНЫЙ. Он нужен, чтобы вы увидели, как выглядит
# «кеш вроде включили, а быстрее не стало». Рабочий вариант — в cache-patch.yaml.
#
# Применяется в вашем кластере `lab` (export KUBECONFIG=~/lab.kubeconfig):
#   kubectl patch deployment passes-api --patch-file cache-patch-broken.yaml
#
# Ответ подсматривать не надо. Примените, сделайте пару запросов и посмотрите логи
# приложения: kubectl logs -l app=passes-api. Приложение говорит, что с ним не так,
# — вопрос в том, чтобы прочитать сообщение и понять, чего в этом файле не хватает.
#
# Подставьте адрес своего Redis вместо REDIS-ADDR (см. шаг про поиск адреса).
# Заглушку оставлять нельзя: тогда вы получите не ту ошибку, ради которой всё затевалось.
spec:
  template:
    spec:
      containers:
        # Имя контейнера — адрес, по которому кластер находит место для правки.
        - name: api
          env:
            - name: REDIS_ADDR
              value: "REDIS-ADDR:6379"
