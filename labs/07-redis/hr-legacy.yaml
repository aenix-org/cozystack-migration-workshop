---
# Легаси-справочник сотрудников. В жизни это чужая система, которую вам не отдадут
# переписывать: она отвечает 800 мс, и с этим надо как-то жить.
# Здесь — заглушка с тем же поведением, чтобы было что измерять.
#
# Перед применением подставьте адрес своего Harbor вместо HARBOR-HOST:
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' *.yaml   # macOS
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-legacy
  labels:
    app: hr-legacy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hr-legacy
  template:
    metadata:
      labels:
        app: hr-legacy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: harbor
      containers:
        - name: hr
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          image: HARBOR-HOST/passes/passes-api:v2
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MODE
              value: "hr"
            # Ровно та задержка, которую показывает настоящий справочник.
            # Меняя её, вы меняете «насколько всё плохо» — попробуйте потом 2s.
            - name: HR_DELAY
              value: "800ms"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: "1"
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hr-legacy
spec:
  selector:
    app: hr-legacy
  ports:
    - port: 80
      targetPort: http
