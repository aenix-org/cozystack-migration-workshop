# Лаба 13. Шаблон Deployment: что запускать и в скольких копиях.
#
# Файлы в templates/ — заготовки, а не готовые манифесты. Helm подставляет в них значения
# и отдаёт результат кластеру: `helm template main chart` показывает готовый текст, ничего
# не применяя, `helm install main chart` — применяет.
#
# Двойные фигурные скобки — место подстановки. Внутри них встречается:
#   .Values.имя   — значение параметра: из values.yaml, если заказчик его не трогал,
#                   или из формы заказа в дашборде, если выбрал своё;
#   .Release.Name — имя релиза, то есть имя конкретного разворачивания чарта.
# Текст вне скобок уходит в манифест как есть.
apiVersion: apps/v1
kind: Deployment
metadata:
  # Имена объектов собираются из имени релиза, а не пишутся жёстко. Один и тот же чарт
  # разворачивают в одном namespace не по разу, и фиксированное имя означало бы, что
  # второй заказ затирает первый. Релиз `main` даёт Deployment, Service и ConfigMap
  # с именем `main` — по имени сразу видно, что это одна группа.
  name: {{ .Release.Name }}
  # Метки: name одинаков у всех заказов этого приложения, instance различает заказы.
  # По ним объекты находят друг друга и по ним же отбирают вывод `kubectl get`.
  labels:
    app.kubernetes.io/name: guest-pass
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  # Сколько копий держать запущенными. Если копия исчезнет, кластер создаст новую,
  # не спрашивая, — отсюда самолечение без дежурного администратора.
  replicas: {{ .Values.replicas }}
  # selector говорит Deployment, какие поды считать своими, — по меткам, а не по именам.
  # Метки здесь и метки в template.metadata.labels обязаны совпадать. Разошлись —
  # Deployment не находит собственные копии и штампует их снова и снова.
  selector:
    matchLabels:
      app.kubernetes.io/name: guest-pass
      app.kubernetes.io/instance: {{ .Release.Name }}
  # template — образец пода. Всё, что ниже, описывает не сам Deployment, а копии
  # приложения, которые он по этому образцу создаёт.
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guest-pass
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # Хэш конфигурации в аннотации пода. Без него правка ConfigMap не перезапускает
        # поды, и новый текст не появляется, пока кто-нибудь не удалит их руками.
        # Это самая частая жалоба на чарты вообще.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # Приложение работает не от root и с урезанными правами. Чарт из каталога
      # разворачивают чужие тенанты в своих namespace, и права контейнера — часть того,
      # что вы им обещаете вместе с приложением.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Образ записан в шаблоне и в параметры не вынесен намеренно: заказчик выбирает
          # размер и текст, но не подменяет само приложение на произвольное.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # Порт внутри контейнера. Имя http дальше используется в пробе и в Service,
          # чтобы номер порта был записан в одном месте, а не в трёх.
          ports:
            - containerPort: 8080
              name: http
          # requests — сколько выделить гарантированно, по этим числам планировщик
          # подбирает узел. limits здесь только по памяти: превысил — контейнер убивают
          # и поднимают заново. Лимита на CPU нет намеренно, иначе приложение упирается
          # в потолок вместо того, чтобы отработать медленнее.
          # Фильтр `| quote` оборачивает подставленное значение в кавычки: пользователь
          # может ввести 1, и без кавычек в манифест уйдёт число там, где ждут запись
          # вида "1" или "100m".
          resources:
            requests:
              cpu: {{ .Values.resources.cpu | quote }}
              memory: {{ .Values.resources.memory | quote }}
            limits:
              memory: {{ .Values.resources.memory | quote }}
          # readinessProbe — вопрос «готов принимать запросы?». Пока /healthz не ответил,
          # Service не шлёт на эту копию трафик. Отсюда обновление без обрыва: старую
          # копию выводят из балансировки после того, как ответила новая.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
          # Страница и конфиг nginx подключаются файлами из ConfigMap. subPath подставляет
          # ровно один файл: без него смонтированный каталог подменил бы весь /etc/nginx/
          # conf.d и штатные настройки образа исчезли бы.
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      # Имя ConfigMap собрано из имени релиза, поэтому под всегда монтирует конфигурацию
      # своего заказа, а не соседнего.
      volumes:
        - name: page
          configMap:
            name: {{ .Release.Name }}
        - name: conf
          configMap:
            name: {{ .Release.Name }}
