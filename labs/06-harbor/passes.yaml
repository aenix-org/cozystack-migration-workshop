---
# Лаба 6 · Свой приватный реестр образов. РАБОЧИЙ вариант манифеста.
#
# Это тот же файл, что passes-broken.yaml, плюс одно место, которого там не хватало —
# оно отмечено ниже словами «ВОТ ЧЕГО НЕ ХВАТАЛО». Применяйте его после того, как
# увидели отказ на сломанном варианте и разобрались, почему он произошёл.
#
# Применяется на вашем кластере `lab` (не на управляющем кластере Cozystack — там
# живёт только сам Harbor), в пространстве имён по умолчанию:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl delete -f passes-broken.yaml
#     kubectl apply -f passes.yaml
#
# ⚠️ HARBOR-HOST — заглушка, а не рабочий адрес. Перед применением подставьте адрес
# своего Harbor; строка HARBOR-HOST встречается в файле дважды, sed заменит обе:
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes.yaml   # macOS
#
# В объектах ниже: apiVersion — версия схемы описания, kind — что создаём,
# metadata.name — имя объекта. Отдельно дальше не поясняются.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # Две копии, а не одна: так в ответе сервиса будет видно, что запросы обслуживают
  # разные поды, и что образ скачался на узел один раз, а запустился дважды.
  replicas: 2
  # Условие «мои копии — это поды с меткой app: passes-api». Метка в образце пода ниже
  # должна совпадать с этой, иначе кластер отклонит манифест.
  selector:
    matchLabels:
      app: passes-api
  # Образец, по которому штампуются копии. Всё, что внутри, описывает один под.
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # Ограничения безопасности на весь под: не запускать от root, работать под
      # непривилегированным пользователем 65532, ограничить набор системных вызовов
      # стандартным профилем. Образ собран под это же (см. app/Dockerfile, строка USER).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # ВОТ ЧЕГО НЕ ХВАТАЛО в passes-broken.yaml — эти две строки, и больше ничего.
      #
      # Закрытый реестр отдаёт образ не всякому: сначала надо назваться. Секрет `harbor`
      # (тип kubernetes.io/dockerconfigjson) хранит адрес реестра, логин и пароль; вы
      # создали его командой kubectl create secret docker-registry. Здесь секрет только
      # НАЗЫВАЕТСЯ по имени — берёт его оттуда не приложение, а kubelet на узле, в тот
      # момент, когда идёт скачивать образ. Поэтому секрет должен лежать в том же
      # пространстве имён, что и под: kubelet ищет его именно там и никуда больше.
      imagePullSecrets:
        - name: harbor
      containers:
        - name: api
          # Права на уровне контейнера: не добирать себе привилегий и отдать все особые
          # полномочия ядра. Приложению нужен один сетевой порт, остальное лишнее.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Первая часть имени образа — адрес реестра, и именно поэтому переезд на свой
          # реестр меняет манифесты: имя образа становится другим. Не будь адреса в
          # начале, кластер пошёл бы за образом в Docker Hub, а ИБ это и запретила.
          image: HARBOR-HOST/passes/passes-api:v1
          # Порт приложения. Имя `http` дальше используют проверка готовности и Service,
          # так что номер порта задан в одном месте, а не в трёх.
          ports:
            - containerPort: 8080
              name: http
          # Переменные окружения, из которых приложение узнаёт, кто оно и откуда приехало.
          # Ровно их оно и печатает в ответе (см. app/main.go, структура identity).
          # APP_VERSION и IMAGE_REGISTRY заданы текстом — их пишем мы сами.
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            # Дальше — Downward API: кластер сам кладёт в переменные то, что знает о поде.
            # Приложению не нужно ни угадывать своё имя, ни ходить за ним в API кластера,
            # ни носить с собой права на такой запрос. Значения подставляются в момент
            # запуска копии, поэтому у каждой копии они свои.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — что зарезервировать под копию: по этим числам планировщик выбирает
          # узел. limits — потолок: за память выше потолка контейнер убивают, за
          # процессор — притормаживают. 16Mi хватает потому, что приложение на Go без
          # зависимостей и почти ничего не держит в памяти; у JVM было бы на два порядка
          # больше. 20m — двадцать тысячных процессорного ядра.
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # Проверка готовности: пока приложение не ответит на /healthz, Service не
          # пустит на эту копию трафик. При выкатке новой версии старая копия убирается
          # из балансировки только после того, как новая ответила, — поэтому запросы
          # не падают на ещё не поднявшемся процессе.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
# Постоянное имя, за которым стоят обе копии. Поды пересоздаются и меняют адреса,
# имя passes-api.default.svc.cluster.local не меняется. Без этого объекта приложение
# работает, но достучаться до него внутри кластера не по чему — и проверка в check.sh
# ходит именно сюда, а не в под.
apiVersion: v1
kind: Service
metadata:
  name: passes-api
spec:
  # Связь с подами — не список адресов, а условие по метке. Новая копия с меткой
  # app: passes-api попадает под балансировку сама, регистрировать её не нужно.
  selector:
    app: passes-api
  # port — на каком порту отвечает сам Service; targetPort ссылается на имя `http`
  # из блока ports выше, а не на номер, поэтому связь не порвётся при смене номера.
  ports:
    - port: 80
      targetPort: http
