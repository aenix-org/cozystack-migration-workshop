---
# Лаба 6 · Свой приватный реестр образов. ЭТОТ ФАЙЛ НАМЕРЕННО НЕПОЛНЫЙ.
#
# Он не заработает, и это задумано: вы должны увидеть отказ своими глазами и сами
# понять, чего кластеру не хватило. Не хватает здесь одного — того, чем кластер
# называется закрытому реестру, когда приходит за образом. Реестр не отдаёт образы
# кому попало, а в этом описании нет ничего, что помогло бы кластеру доказать своё
# право. Какая именно строчка это чинит — разберёте по ходу лабы; рабочий вариант
# лежит рядом, в passes.yaml, и открывать его до разбора смысла нет.
#
# Здесь только Deployment, без Service: постоянное имя сервису пока не нужно —
# до отвечающего пода мы всё равно не доберёмся, раз образ не скачивается.
#
# Применяется на вашем кластере `lab`, в пространстве имён по умолчанию:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f passes-broken.yaml
#     kubectl get pods -l app=passes-api -w
#
# ⚠️ HARBOR-HOST — заглушка, а не рабочий адрес. Подставьте адрес своего Harbor,
# иначе получите не ту ошибку, ради которой файл написан (строк с заглушкой две):
#   sed -i    's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # Linux
#   sed -i '' 's|HARBOR-HOST|harbor.workshop03.example.org|g' passes-broken.yaml   # macOS
#
# В объекте ниже: apiVersion — версия схемы описания, kind — что создаём,
# metadata.name — имя объекта. Отдельно дальше не поясняются.
#
# Deployment — это не «запусти контейнер», а «держи запущенным столько-то копий вот
# такого контейнера». Копия исчезнет — кластер создаст новую, не спрашивая.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes-api
  labels:
    app: passes-api
spec:
  # Одна копия: чтобы разбирать отказ, хватит и одной, а в логах и в выводе
  # kubectl describe будет меньше шума.
  replicas: 1
  # Условие «мои копии — это поды с меткой app: passes-api». Метка в образце пода ниже
  # должна совпадать с этой, иначе кластер отклонит манифест.
  selector:
    matchLabels:
      app: passes-api
  # Образец, по которому штампуются копии. Всё, что внутри, описывает один под.
  template:
    metadata:
      labels:
        app: passes-api
    spec:
      # Ограничения безопасности на весь под: не запускать от root, работать под
      # непривилегированным пользователем 65532, ограничить набор системных вызовов
      # стандартным профилем. Образ собран под это же (см. app/Dockerfile, строка USER).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Права на уровне контейнера: не добирать себе привилегий и отдать все особые
          # полномочия ядра. Приложению нужен один сетевой порт, остальное лишнее.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Первая часть имени образа — адрес реестра. Именно поэтому переезд на свой
          # реестр меняет манифесты: имя образа становится другим. Не будь адреса,
          # кластер пошёл бы за образом в Docker Hub — то есть туда, куда ИБ запретила.
          image: HARBOR-HOST/passes/passes-api:v1
          # Порт приложения. Имя `http` дальше используется проверкой готовности,
          # так что номер порта задан в одном месте, а не в двух.
          ports:
            - containerPort: 8080
              name: http
          # Переменные окружения, из которых приложение узнаёт, кто оно и откуда приехало.
          # Ровно их оно и печатает в ответе (см. app/main.go, структура identity).
          # APP_VERSION и IMAGE_REGISTRY заданы текстом — их пишем мы сами; три следующие
          # заполняет сам кластер в момент запуска копии, приложению их знать неоткуда.
          env:
            - name: APP_VERSION
              value: "v1"
            - name: IMAGE_REGISTRY
              value: HARBOR-HOST
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # requests — что зарезервировать под копию: по этим числам планировщик выбирает
          # узел. limits — потолок: за память выше потолка контейнер убивают, за
          # процессор — притормаживают. 16Mi хватает потому, что приложение на Go без
          # зависимостей. 20m — двадцать тысячных процессорного ядра.
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # Проверка готовности: пока приложение не ответит на /healthz, трафик на копию
          # не пойдёт. Сегодня до неё дело не дойдёт — она проверяет уже запущенный
          # процесс, а у нас застрянет более ранний шаг, скачивание образа.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
