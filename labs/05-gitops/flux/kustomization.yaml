---
# Что именно из репозитория применять в кластер.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: passes
  namespace: flux-system
spec:
  # Как часто сверять фактическое состояние кластера с описанным в Git.
  # Это не «раз в минуту применить заново» — это «раз в минуту сравнить и
  # исправить расхождения». Разницу вы увидите на шаге 6.
  interval: 1m
  # Папка внутри репозитория. Всё, что лежит в ней, попадёт в кластер.
  path: ./apps
  # Удалять из кластера объекты, которые исчезли из Git.
  # Без этого Git перестаёт быть полным описанием: удалённое из репозитория
  # продолжало бы работать в кластере, и никто бы об этом не знал.
  prune: true
  sourceRef:
    kind: GitRepository
    name: passes
  # Дожидаться готовности применённого, а не отчитываться сразу после apply.
  wait: true
  timeout: 3m
