---
# Лаба 5 · Инфраструктура в Git. Источник: откуда Flux берёт желаемое состояние.
#
# Применяется на вашем кластере `lab` вместе с соседним kustomization.yaml:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f flux/
#
# ⚠️ ЗАМЕНИТЕ url на адрес СВОЕГО репозитория, прежде чем применять: строка
# ЗАМЕНИТЕ-МЕНЯ — заглушка, с ней Flux пойдёт в несуществующий адрес и встанет
# с ошибкой. Ветку тоже проверьте: GitHub создаёт новые репозитории с веткой main.
#
# В каждом объекте: apiVersion — версия схемы описания, kind — что создаём,
# metadata.name — имя, по которому на объект ссылаются дальше. Ниже не повторяется.
#
# Единственная задача этого объекта — держать в кластере свежую копию репозитория.
# Он ничего не применяет: только скачивает. Применяет соседний Kustomization,
# и он ссылается сюда по имени `passes`, поэтому имя менять нельзя в одиночку.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: passes
  # flux-system — пространство имён, которое завела команда flux install; в нём живут
  # сами службы Flux. Объекты-настройки кладут туда же, иначе службы их не увидят.
  namespace: flux-system
spec:
  # Как часто ходить в Git за новым состоянием. Одна минута — для лабы;
  # в бою обычно 1–5 минут, а мгновенную реакцию делают вебхуком из GitHub.
  interval: 1m
  # Адрес репозитория. Он публичный, поэтому ни логина, ни ключа здесь нет —
  # это упрощение учебного стенда. В бою репозиторий приватный, и рядом появляется
  # ссылка на секрет с deploy-ключом (поле secretRef).
  url: https://github.com/ЗАМЕНИТЕ-МЕНЯ/passes-gitops
  # Какую ветку считать источником истины. В кластер поедет то, что влито в main;
  # то, что лежит в других ветках, не поедет. Отсюда и берётся ревью: изменение
  # сначала живёт в своей ветке, где его можно посмотреть, и только слияние в main
  # делает его действующим. Если репозиторий создан со старой веткой master —
  # исправьте здесь, иначе Flux не найдёт, что читать.
  ref:
    branch: main
