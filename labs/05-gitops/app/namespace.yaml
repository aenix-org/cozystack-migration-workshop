---
# Отдельное пространство имён под сервис «Пропуск».
# Лежит в Git вместе с приложением намеренно: когда сервис уедет из репозитория,
# Flux уберёт и пространство имён — не останется пустой папки, про которую через
# полгода никто не вспомнит, зачем она.
apiVersion: v1
kind: Namespace
metadata:
  name: passes
  labels:
    app.kubernetes.io/part-of: passes
