---
# Лаба 5 · Инфраструктура в Git. Сам сервис «Пропуск»: четыре объекта в одном файле.
#
# Руками в кластер не применяется. Файл кладётся в свой репозиторий на GitHub, в папку
# apps/, рядом с namespace.yaml, а в кластер `lab` его переносит Flux — сам:
#     cp app/*.yaml ~/passes-gitops/apps/
#     cd ~/passes-gitops && git add apps && git commit -m "add passes service v1" && git push
#
# Строка --- разделяет объекты: один файл, четыре независимых объекта. Порядок в файле
# на порядок создания не влияет — кластер разберётся сам.
#
# В каждом объекте: apiVersion — версия схемы описания, kind — что создаём,
# metadata.name — имя объекта, metadata.namespace — в какой перегородке кластера он
# живёт. Дальше эти поля отдельно не поясняются.
#
# Ни в одном из четырёх объектов нет ни пароля, ни ключа, ни токена, и это не
# случайность: попавшее в Git остаётся там навсегда — историю можно переписать, но
# у всех, кто успел склонировать, старая копия сохранится. Секретам здесь не место.

# --- 1 из 4. Настройки веб-сервера --------------------------------------------------
# ConfigMap кладёт в кластер текстовый файл отдельно от приложения, а ниже (в разделе
# volumes) этот файл подкладывается внутрь контейнера. Смысл — менять настройки, не
# пересобирая образ: правите здесь, коммитите, и через минуту в кластере новая версия.
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-conf
  namespace: passes
# Ключ внутри data становится именем файла в контейнере: default.conf ляжет в папку,
# которую nginx читает при старте. Вертикальная черта после имени — способ записать
# в YAML многострочный текст как есть, с сохранением переносов.
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;

      # Адрес для проверки готовности. Кластер стучится сюда и не пускает
      # трафик на копию, пока не получит ответ.
      location /healthz {
        access_log off;
        return 200 "ok\n";
      }

      location / {
        # В отдаваемой странице подменяем __POD__ на имя машины, где работает
        # nginx. Внутри пода имя машины — это имя самого пода.
        sub_filter '__POD__' '$hostname';
        sub_filter_once off;
      }
    }
---
# --- 2 из 4. Страница, которую сервис отдаёт ----------------------------------------
# В этой лабе страница — заглушка: настоящее приложение появится позже. Сейчас важно
# не что показывает сервис, а откуда он взялся в кластере. Текст __POD__ в разметке —
# метка для подстановки: nginx заменит её на имя пода, отдавшего страницу, и по этому
# имени вы дальше увидите, что копий стало больше одной.
apiVersion: v1
kind: ConfigMap
metadata:
  name: passes-page
  namespace: passes
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <title>Пропуск</title>
      <style>
        body { font-family: system-ui, sans-serif; margin: 4rem auto; max-width: 40rem;
               color: #222; }
        h1 { font-weight: 600; }
        .v { display: inline-block; padding: .2rem .6rem; border-radius: .3rem;
             background: #eef; font-family: ui-monospace, monospace; }
        .pod { margin-top: 2rem; color: #666; font-size: .9rem; }
        b { font-family: ui-monospace, monospace; color: #222; }
      </style>
    </head>
    <body>
      <h1>Сервис «Пропуск»</h1>
      <p>Заказ пропуска для гостя. Версия <span class="v">v1</span></p>
      <p>Развёрнуто из Git. Руками сюда никто не ходил.</p>
      <div class="pod">вас обслужил под <b>__POD__</b></div>
    </body>
    </html>
---
# --- 3 из 4. Описание самого приложения ---------------------------------------------
# Deployment — это не «запусти контейнер», а «держи запущенным столько-то копий вот
# такого контейнера». Разница видна, когда копия умирает: кластер создаёт новую, не
# спрашивая и не уведомляя. В vSphere ближе всего HA, но там перезапускается машина,
# а здесь пересоздаётся копия приложения, и делается это постоянно, а не при аварии.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passes
  namespace: passes
  labels:
    app: passes
spec:
  # Сколько копий держать запущенными. Формулировка важна: не «запусти одну», а
  # «держи одну». Это число вы поменяете через Git и посмотрите, что произойдёт.
  replicas: 1
  # По какому признаку Deployment узнаёт свои копии. Это не список имён подов —
  # имена меняются при каждом пересоздании, — а условие «все поды с меткой app: passes».
  # Метка ниже, в template.metadata.labels, должна совпадать с этим условием: разойдутся
  # — кластер откажется принимать манифест, потому что копии окажутся ничьими.
  selector:
    matchLabels:
      app: passes
  # template — образец, по которому штампуются копии. Всё, что внутри, описывает один
  # под. Правка образца означает выкатку новой версии: старые копии заменяются новыми.
  template:
    metadata:
      labels:
        app: passes
    spec:
      # Ограничения безопасности на уровне всего пода. В vSphere аналога нет: там
      # изоляция даётся гипервизором, а контейнеры делят ядро с узлом, поэтому права
      # приходится урезать явно.
      #   runAsNonRoot   не запускать, если образ хочет работать от root
      #   runAsUser      под каким числовым пользователем работать; 65532 — принятый
      #                  «непривилегированный» идентификатор в минимальных образах
      #   seccompProfile какие системные вызовы разрешены; RuntimeDefault — набор,
      #                  который отсекает заведомо опасное и ничего не ломает
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Те же ограничения, но уже на конкретный контейнер.
          #   allowPrivilegeEscalation: false  процесс не сможет добрать себе прав
          #   capabilities.drop: ["ALL"]       отобрать все особые полномочия ядра
          #                                    (менять сеть, монтировать, менять время);
          #                                    веб-серверу они не нужны ни одно
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Образ берётся из публичного реестра — в следующей лабе ИБ это запретит, и
          # адрес сменится на свой Harbor. Вариант unprivileged выбран не для красоты:
          # обычный образ nginx слушает порт 80 и хочет для этого права root, а с
          # runAsNonRoot выше он бы не стартовал вовсе.
          # Версия зафиксирована (1.27-alpine), а не latest: иначе один и тот же
          # манифест завтра развернёт другое приложение, и вы об этом не узнаете.
          image: nginxinc/nginx-unprivileged:1.27-alpine
          # Порт, который слушает приложение. Имя `http` — не украшение: на него
          # ссылаются проверка готовности ниже и Service в конце файла. Поменяете
          # номер порта — менять его придётся в одном месте, а не в трёх.
          ports:
            - containerPort: 8080
              name: http
          # requests — сколько ресурсов гарантированно зарезервировать; по этому числу
          # планировщик выбирает узел. limits — потолок, выше которого не пустят.
          # Занижение requests означает, что на узел влезет больше, чем он потянет;
          # превышение limits по памяти — контейнер убивают, по процессору — притормаживают.
          # 20m = двадцать тысячных ядра, Mi = мегабайты. Значения здесь маленькие,
          # потому что узел в лабе один и он невелик.
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 64Mi
          # Проверка готовности: кластер стучится по этому адресу и не пускает трафик
          # на копию, пока не получит ответ. Без неё Service отправил бы запросы в
          # ещё не поднявшийся nginx, и пользователь увидел бы ошибку при каждой выкатке.
          # Её же ждёт Flux — в kustomization.yaml мы просили wait: true.
          #   initialDelaySeconds  подождать перед первым стуком, дать процессу стартовать
          #   periodSeconds        как часто стучаться дальше
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          # Куда внутри контейнера подложить содержимое двух ConfigMap из начала файла.
          # /etc/nginx/conf.d — папка, откуда nginx читает настройки при старте,
          # /usr/share/nginx/html — папка, из которой он отдаёт файлы.
          # Образ при этом не меняется: файлы появляются в нём в момент запуска.
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: page
              mountPath: /usr/share/nginx/html
      # Что именно подкладывать. Имена conf и page — внутренние, они связывают этот
      # блок с volumeMounts выше; name внутри configMap — уже имя реального объекта
      # в кластере. Ошибётесь в нём — под будет висеть и ждать несуществующий ConfigMap.
      volumes:
        - name: conf
          configMap:
            name: passes-conf
        - name: page
          configMap:
            name: passes-page
---
# --- 4 из 4. Постоянное имя, за которым стоят все копии -----------------------------
# Поды пересоздаются, и адреса у них каждый раз новые. Service даёт неизменное имя —
# passes.passes.svc.cluster.local, — по которому внутри кластера всегда можно достучаться
# до живых копий. Это внутренняя балансировка, снаружи кластера сюда пока не попасть.
apiVersion: v1
kind: Service
metadata:
  name: passes
  namespace: passes
spec:
  # Связь Service с подами — не список адресов, а условие «все поды с меткой app: passes».
  # Появилась новая копия с такой меткой — она сама попала под балансировку, ничего
  # регистрировать не нужно. Пропала — её убрали из выдачи.
  selector:
    app: passes
  # port — на каком порту отвечает сам Service, targetPort — куда он перенаправляет
  # внутрь контейнера. Здесь targetPort ссылается на имя `http` из блока ports выше,
  # а не на номер: номер можно поменять в одном месте, и связь не порвётся.
  ports:
    - port: 80
      targetPort: http
