---
# Лаба 3. Растим реплики по загрузке процессора.
# Цель 50% от requests.cpu (20m), то есть порог — 10m на под.
# Взято низким намеренно: нагрузка должна срабатывать за секунды,
# у нас на лабу двадцать минут, а не полдня.
#
# Один объект. Применяется на вашем учебном кластере `lab`, а не в тенанте
# на управляющем кластере:
#     export KUBECONFIG=~/lab.kubeconfig
#     kubectl apply -f hpa.yaml
# Заглушек вроде tenant-workshopXX здесь нет — подставлять свой номер никуда не нужно.
#
# Два условия, без которых объект создастся, но работать не будет:
#   1. У контейнера rickroll задан requests.cpu — иначе проценты не от чего считать,
#      и в колонке TARGETS у `kubectl get hpa` навсегда останется <unknown>.
#   2. В кластере работает metrics-server — источник текущего потребления подов.
# Оба условия проверяет check.sh в этой папке.
#
# Пока HPA существует, поле replicas у Deployment принадлежит ему. Изменить число
# копий руками через `kubectl scale` можно, но HPA вернёт своё в ближайшие секунды.
# Поэтому в лабе 4 перед выкаткой этот объект удаляют: два механизма на одно поле —
# гарантированный способ не понять, что произошло.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  # Имя HPA не обязано совпадать с именем приложения — совпадение здесь ради удобства.
  # Кем управлять, определяет scaleTargetRef ниже, а не это имя.
  name: rickroll
spec:
  # На кого смотреть и чьё поле replicas менять. Три поля вместе, потому что имя
  # без типа неоднозначно: Deployment и StatefulSet могут зваться одинаково.
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rickroll
  # Коридор, за который HPA не выйдет ни при какой нагрузке. Нижняя граница — та же
  # одна копия, с которой лаба начиналась. Верхняя — шесть: столько помещается
  # на учебный узел при limits.cpu 300m и при этом заметно на глаз в списке подов.
  # Поставите maxReplicas: 1 — объект создастся и не сделает ничего.
  minReplicas: 1
  maxReplicas: 6
  # По чему принимать решение. Метрик может быть несколько, тогда HPA берёт ту,
  # которая требует большего числа копий. Здесь она одна — процессор.
  metrics:
    - type: Resource
      resource:
        name: cpu
        # Utilization — доля от requests.cpu контейнера, а не от мощности узла.
        # Отсюда неинтуитивное следствие: значение спокойно бывает 600%, и это
        # не ошибка: под ест в шесть раз больше, чем зарезервировал.
        # Альтернатива — AverageValue, где порог задают в миллиядрах напрямую.
        target:
          type: Utilization
          averageUtilization: 50
  # Насколько резво реагировать. Блок необязательный: без него берутся значения
  # по умолчанию, рассчитанные на боевую эксплуатацию, а не на демонстрацию.
  behavior:
    scaleUp:
      # По умолчанию Kubernetes ждёт стабилизации и растёт медленно.
      # На лабе это выглядит как «ничего не происходит», поэтому ускоряем.
      stabilizationWindowSeconds: 0
      # Не больше двух новых копий за каждые пятнадцать секунд. Шаг подобран опытным
      # путём: рост видно как рост, а не как мгновенный скачок с одной сразу до шести,
      # в котором участнику нечего разглядывать.
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      # А вот вниз наоборот — не мгновенно, иначе поды исчезнут
      # раньше, чем участник успеет их разглядеть.
      # Минута вместо пяти по умолчанию: лаба идёт двадцать минут, ждать сжатия
      # пять из них нечем занять. В рабочем кластере длинное окно как раз полезно —
      # оно гасит качели на неровной нагрузке.
      stabilizationWindowSeconds: 60
