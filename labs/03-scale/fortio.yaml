---
# Генератор нагрузки с веб-мордой.
# Взят вместо hey/ab намеренно: нагрузку запускают кнопкой в браузере,
# а гистограмму задержек видно там же. На прошлых воркшопах мы теряли
# людей именно на консольных инструментах.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio
  labels:
    app: fortio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fortio
  template:
    metadata:
      labels:
        app: fortio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fortio
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          image: fortio/fortio:latest
          args: ["server"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              # Генератору нужен запас по процессору, иначе он упрётся
              # в себя и вы будете нагружать не приложение, а Fortio.
              cpu: "1"
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fortio
spec:
  selector:
    app: fortio
  ports:
    - port: 8080
      targetPort: http
